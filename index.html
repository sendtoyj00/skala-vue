<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>왈씨 Walssi — 지금, 우리 아이 산책 괜찮을까요</title>

    <!-- 새로고침 시 색상 번쩍임 방지: 날씨 API 응답 전까지는 :root 기본값(흐림 무드)이 잠깐
         보였다가 실제 날씨 무드로 바뀌면서 색이 튀어 보였다. Vue가 로드되기 전, 페인트가
         일어나기 전에 마지막으로 확인된 무드를 즉시 적용해 그 틈을 없앤다
         (App.vue가 날씨를 새로 받아올 때마다 이 캐시를 갱신한다). -->
    <script>
      try {
        var cachedMood = localStorage.getItem('walssi:lastWeatherMood')
        if (cachedMood) document.documentElement.dataset.weather = cachedMood
      } catch (e) {}
    </script>

    <!-- 타이포그래피: Pretendard(본문/디스플레이, 한글 가변폭 산세리프) + JetBrains Mono(수치·계측값
         전용). 온도·분·퍼센트 같은 "측정값"은 고정폭 모노스페이스로 통일해 계측기 느낌을 준다
         (frontend-design 방향: 화면 전반의 서명 요소). -->
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      as="style"
      href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.css"
    />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;600;700&display=swap"
    />

    <!-- Google Ad Placement(adBreak) — 테스트 모드. components/common/AdBreakSlot.vue가 소비한다.
         지역 날씨 화면에만 노출되고 산책 판정 화면에는 절대 두지 않는다(service_architecture.md 10절).
         data-adbreak-test="on"은 실제 서비스 전환 전 반드시 제거하고 client id도 실제 값으로 교체한다. -->
    <script
      async
      data-adbreak-test="on"
      src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=%VITE_ADSENSE_CLIENT_ID%"
      crossorigin="anonymous"
    ></script>
    <script>
      window.adsbygoogle = window.adsbygoogle || []
      var adBreak = (adConfig = function (o) {
        adsbygoogle.push(o)
      })
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
